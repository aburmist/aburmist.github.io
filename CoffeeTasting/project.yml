name: CoffeeTasting

options:
  bundleIdPrefix: com.aburmist
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team id here (Xcode > Signing & Capabilities also works).
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  CoffeeTasting:
    type: application
    platform: iOS
    sources:
      - path: CoffeeTasting
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Coffee Tasting
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera is the live background behind your cup of coffee.
        NSMicrophoneUsageDescription: The microphone records your spoken tasting notes.
        NSSpeechRecognitionUsageDescription: Speech recognition turns your spoken tasting notes into text.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aburmist.CoffeeTasting
        PRODUCT_NAME: CoffeeTasting
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true

  CoffeeTastingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoffeeTastingTests
    dependencies:
      - target: CoffeeTasting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aburmist.CoffeeTastingTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  CoffeeTasting:
    build:
      targets:
        CoffeeTasting: all
        CoffeeTastingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoffeeTastingTests
    profile:
      config: Release
    archive:
      config: Release
